jobs:
  build:
    name: Build ROM (US)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            clang \
            binutils-mips-linux-gnu \
            libglib2.0-dev

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml capstone lark mapfile-parser

      - name: Setup Toolchain & Dependencies
        run: |
          if [ -f installDependencies.sh ]; then
            bash installDependencies.sh
          fi

      - name: Provide Baserom
        env:
          BASEROM_BASE64: ${{ secrets.BASEROM_US_Z64 }}
        run: |
          if [ -n "$BASEROM_BASE64" ]; then
            echo "$BASEROM_BASE64" | base64 --decode > baserom.us.z64
            echo "Baserom successfully decoded from GitHub Secrets."
          else
            echo "Warning: No baserom secret found. Creating a dummy placeholder for compilation testing."
            # Note: A real ROM is required for a successful matching comparison target.
            touch baserom.us.z64
          fi

      - name: Build ROM (US Region)
        run: |
          make VERSION=us -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smashbrothers-us-rom
          path: |
            build/smashbrothers.us.z64
            build/smashbrothers.us.elf
            build/smashbrothers.us.map
