name: Build ROM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        version: [us] # Add 'jp' if desired when ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libglib2.0-dev \
            pkg-config \
            python3-pip \
            python3-dev \
            clang \
            binutils-mips-linux-gnu

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml watchdog # commonly used in splat/n64 decomp toolchains

      - name: Provide Baserom
        env:
          BASEROM_BASE64: ${{ secrets.BASEROM_US }} # Optional: if stored in GitHub Secrets
        run: |
          # If you store your baserom as a base64 secret, decode it here:
          # echo "$BASEROM_BASE64" | base64 --decode > baserom.${{ matrix.version }}.z64
          
          # Alternatively, ensure your baserom is tracked or provided via LFS/secrets.
          ls -la baserom.${{ matrix.version }}.z64 || echo "Warning: Baserom not found yet."

      - name: Build ROM
        run: |
          make VERSION=${{ matrix.version }} -j$(nproc)